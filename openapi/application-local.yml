
server:
  port: 8080

spring:
  application:
    name: vib-cms-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/vib_cms
    username: cms_local
    password: ${CMS_DB_PASSWORD}

    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    
management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
