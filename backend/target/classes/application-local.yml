server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vib_cms
    username: cms_local
    password: ${CMS_DB_PASSWORD:local_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

cms:
  security:
    # Local development only. Never activate this profile in production.
    local-permit-all: true
