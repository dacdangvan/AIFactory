server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vib_cms
    username: cms_local
    password: ${CMS_DB_PASSWORD:local_dev_password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    # The local database was initialized from database/01_postgresql_ddl.sql
    # before Flyway was wired into Spring Boot 4. Baseline it as version 1,
    # then apply V2 RBAC seed and V3 Content Management migrations.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

cms:
  security:
    # Local development only. Never activate this profile in production.
    local-permit-all: true
